name: Django CI

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
      - name: Test with pytest
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: ${{ secrets.ENV }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOW_ALL_ORIGINS: ${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
          CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
          ADMINS: ${{ secrets.ADMINS }}
          SHOW_SWAGGER: ${{ secrets.SHOW_SWAGGER }}
          APP_TITLE: ${{ secrets.APP_TITLE }}
          APP_DESCRIPTION: ${{ secrets.APP_DESCRIPTION }}
          INDEX_TITLE: ${{ secrets.INDEX_TITLE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          TIME_ZON: ${{ secrets.TIME_ZONE }}
          USE_TZ: ${{ secrets.USE_TZ }}
          UID: ${{ secrets.UID }}
          GID: ${{ secrets.GID }}
          CELERY_BROKER: ${{ secrets.CELERY_BROKER }}
          CELERY_BACKEND: ${{ secrets.CELERY_BACKEND }}

        run: |
          pytest --doctest-modules \
                 --cov=com --cov-report=html
