name: Load Secrets
on:
  workflow_call:
    inputs:
      output-format:
        description: 'Output format for secrets (env, dotenv, json)'
        required: false
        default: 'env'
        type: string
    secrets:
      ALL_SECRETS:
        description: 'Optional single JSON secret (base64-encoded)'
        required: false

jobs:
  load-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets
        env:
          SECRETS_JSON: ${{ toJson(secrets) }} # Default to all secrets as JSON
        run: |
          # Validate input
          if [ "${{ inputs.output-format }}" != "env" ] && [ "${{ inputs.output-format }}" != "dotenv" ] && [ "${{ inputs.output-format }}" != "json" ]; then
            echo "Error: Invalid output-format: ${{ inputs.output-format }}. Must be 'env', 'dotenv', or 'json'."
            exit 1
          fi

          # Handle single JSON secret if provided
          if [ -n "${{ secrets.ALL_SECRETS }}" ]; then
            echo "${{ secrets.ALL_SECRETS }}" | base64 -d > secrets.json || {
              echo "Error: Failed to decode ALL_SECRETS"
              exit 1
            }
            SECRETS_JSON=$(cat secrets.json)
          fi

          # Process secrets based on output format
          case "${{ inputs.output-format }}" in
            "env")
              echo "$SECRETS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
              ;;
            "dotenv")
              echo "$SECRETS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
              ;;
            "json")
              echo "$SECRETS_JSON" > secrets.json
              ;;
          esac

          # Cleanup temporary files (except if output is json or dotenv)
          if [ "${{ inputs.output-format }}" != "json" ] && [ -f secrets.json ]; then
            rm -f secrets.json
          fi

      - name: Debug output (optional)
        if: always()
        run: |
          if [ -f .env ]; then
            echo ".env created successfully"
            ls -la .env
          else
            echo ".env not found"
          fi