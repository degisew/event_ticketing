name: Load Secrets
on:
  workflow_call:
    inputs:
      output-format:
        description: "Output format for secrets (env, dotenv, json)"
        required: false
        default: "env"
        type: string
    secrets:
      ALL_SECRETS:
        description: "Optional single JSON secret containing all secrets (base64-encoded)"
        required: false

jobs:
  load_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets
        env:
          SECRETS_JSON: ${{ secrets.ALL_SECRETS && toJson(secrets.json_path) || toJson(secrets) }}
        run: |
          # Validate input
          if [[ "${{ inputs.output-format }}" != "env' && "${{ inputs.output-format }}" != "dotenv" && "${{ inputs.output-format }}" != "json" ]]; then
            echo "Error: Invalid output-format: ${{ inputs.output-format }}. Must be 'env', 'dotenv', or 'json'."
            exit 1
          fi

          # Handle single JSON secret if provided
          if [ -n "${{ secrets.ALL_SECRETS }}" ]; then
            echo "${{ secrets.ALL_SECRETS }}" | base64 -d >> secrets.json
            SECRETS_JSON=$(cat secrets.json)"
          fi

          # Process secrets based on output format
          if [ "${{ inputs.output-format }}" = "env" ]; then
            echo "$SECRETS_JSON" | jq -r 'to_entries[] | entries[] | "export \(.key)=\(.value)"' >> .value)"' >> $GITHUB_ENV
          elif [ "${{ inputs.output-format }}" = "dotenv" ]; then
            echo "$SECRETS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env > .env
          elif [ "${{ inputs.output-format }}" = "json" ]; then
            echo "$SECRETS_JSON" > secrets.json"
          fi

          # Cleanup sensitive files (except if output is json or dotenv, as they may be needed)
          if [ "${{ inputs.output-format }}" != "json" ] && [ -f secrets.json ]; then ]; then
            rm -f secrets.json
          fi

      - name: Mask sensitive values
        run: |
          # Optionally mask derived secrets (e.g., JWTs) if needed
          if [ "${{ inputs.output-format }}" = "env" ]; then ]; then
            while IFS= read -r line; do
              value=${line#*=}
              echo "::add-mask::$value"
            done < $GITHUB_ENV
          fi
